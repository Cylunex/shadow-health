openapi: 3.1.0
info:
  title: Shadow Health Agent API
  version: 0.2.0
servers:
  - url: https://health.example.com
security:
  - machineBearer: []
paths:
  /api/machine/v1/agent/profiles/{profile_id}/weekly-evidence:
    get:
      operationId: get_health_weekly_evidence
      summary: Compare two disjoint weeks with source-aware deterministic evidence
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: end
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Bounded aggregate evidence, no private raw records
          content:
            application/json:
              schema: { type: object }
  /api/machine/v1/agent/profiles/{profile_id}/data-status:
    get:
      operationId: get_health_data_status
      summary: Server-observed source reception state without raw logs
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: Source timestamps and counters; no speculative device diagnosis
          content:
            application/json:
              schema: { type: object }
  /api/machine/v1/agent/profiles/{profile_id}/summary:
    get:
      operationId: get_health_profile_summary
      summary: Get the minimum daily summary for a granted Health Profile
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Bounded health summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSummaryResult"
  /api/machine/v1/agent/profiles/{profile_id}/trends:
    get:
      operationId: get_health_profile_trend
      summary: Get aggregate trend statistics without raw daily points
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: metric
          in: query
          required: true
          schema:
            enum: [weight_kg, sleep_hours, steps, heart_rate]
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 7
            maximum: 90
            default: 30
      responses:
        "200":
          description: Aggregate trend summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthTrendResult"
  /api/machine/v1/agent/profiles/{profile_id}/suggestions:
    get:
      operationId: list_health_suggestions
      summary: List explainable weekly Health suggestions without raw events
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: Current Health suggestions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuggestionList" }
  /api/machine/v1/agent/profiles/{profile_id}/meal-asset-photos:
    get:
      operationId: list_health_meal_asset_photos
      summary: Resolve Health-owned Platform Asset references for one meal
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: meal
          in: query
          required: true
          schema: { enum: [早餐, 午餐, 加餐, 晚餐] }
      responses:
        "200":
          description: Stable references without signed URLs or Blob bytes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealAssetList" }
    post:
      operationId: attach_health_meal_asset_photo
      summary: Attach an already authorized Platform Asset image to one meal
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MealAssetAttachmentInput" }
      responses:
        "201":
          description: Idempotent attachment receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealAssetReceipt" }
  /api/machine/v1/agent/profiles/{profile_id}/drafts:
    get:
      operationId: list_pending_health_record_drafts
      summary: List pending drafts created by the same Agent for Nexus review
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
      responses:
        "200":
          description: Pending Agent health drafts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthRecordDraftList"
    post:
      operationId: create_health_record_draft
      summary: Create a pending and reversible health record draft
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthRecordDraftInput"
      responses:
        "201":
          description: Pending draft reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthRecordDraftCreated"
  /api/machine/v1/agent/profiles/{profile_id}/drafts/{draft_id}/commit:
    post:
      operationId: commit_health_record_draft
      summary: Commit one explicitly reviewed Nexus draft to canonical Health data
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: draft_id
          in: path
          required: true
          schema: { type: string, pattern: "^hd_[a-f0-9]{32}$" }
      responses:
        "200":
          description: Applied canonical Health record reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthRecordDraftCommitted"
  /api/machine/v1/agent/profiles/{profile_id}/drafts/{draft_id}/reject:
    post:
      operationId: reject_health_record_draft
      summary: Reject one pending Agent draft from Nexus review
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: draft_id
          in: path
          required: true
          schema: { type: string, pattern: "^hd_[a-f0-9]{32}$" }
      responses:
        "200":
          description: Rejected Health draft reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthRecordDraftRejected"
  /api/machine/v1/agent/nexus/reviews:
    get:
      operationId: list_nexus_health_reviews
      summary: List normalized Health reviews for the Nexus Host
      parameters:
        - $ref: "#/components/parameters/ProfileQuery"
      responses:
        "200":
          description: Normalized review queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NexusReviewList" }
    post:
      operationId: create_nexus_health_review
      summary: Create a Health-owned draft from one reviewed Nexus Proposal
      parameters:
        - $ref: "#/components/parameters/ProfileQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NexusReviewCreate" }
      responses:
        "201":
          description: Normalized Health review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NexusReview" }
  /api/machine/v1/agent/nexus/reviews/{review_id}/commit:
    post:
      operationId: commit_nexus_health_review
      parameters:
        - $ref: "#/components/parameters/ProfileQuery"
        - $ref: "#/components/parameters/ReviewId"
      responses:
        "200":
          description: Committed normalized Health review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NexusReview" }
  /api/machine/v1/agent/nexus/reviews/{review_id}/reject:
    post:
      operationId: reject_nexus_health_review
      parameters:
        - $ref: "#/components/parameters/ProfileQuery"
        - $ref: "#/components/parameters/ReviewId"
      responses:
        "200":
          description: Rejected normalized Health review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NexusReview" }
components:
  securitySchemes:
    machineBearer:
      type: http
      scheme: bearer
  parameters:
    ProfileId:
      name: profile_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9-]{0,63}$"
    ProfileQuery:
      name: profile_id
      in: query
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,63}$" }
    ReviewId:
      name: review_id
      in: path
      required: true
      schema: { type: string, pattern: "^hd_[a-f0-9]{32}$" }
  schemas:
    MealAssetAttachmentInput:
      type: object
      additionalProperties: false
      required: [effective_date, meal, asset_id, version_id]
      properties:
        effective_date: { type: string, format: date }
        meal: { enum: [早餐, 午餐, 加餐, 晚餐] }
        asset_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
    MealAssetReceipt:
      type: object
      additionalProperties: false
      required: [resource_uri, reference_id, asset_id, version_id, display_name, content_type, replayed]
      properties:
        resource_uri: { type: string }
        reference_id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        display_name: { type: string }
        content_type: { type: string, pattern: "^image/" }
        replayed: { type: boolean }
    MealAssetItem:
      type: object
      additionalProperties: false
      required: [resource_uri, reference_id, asset_id, version_id, display_name, content_type]
      properties:
        resource_uri: { type: string }
        reference_id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        display_name: { type: string }
        content_type: { type: string, pattern: "^image/" }
    MealAssetList:
      type: object
      additionalProperties: false
      required: [resource_uri, items]
      properties:
        resource_uri: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/MealAssetItem" }
    SuggestionList:
      type: object
      additionalProperties: false
      required: [protocol, items, generated_at]
      properties:
        protocol: { const: shadow.suggestion-list.v1 }
        items:
          type: array
          items: { $ref: "#/components/schemas/Suggestion" }
        generated_at: { type: string, format: date-time }
    Suggestion:
      type: object
      additionalProperties: false
      required: [protocol, suggestion_id, domain, rule_id, dedupe_key, title, summary, reason, evidence_refs, importance, confidence, allowed_actions, created_at, valid_until, data_freshness]
      properties:
        protocol: { const: shadow.suggestion.v1 }
        suggestion_id: { type: string }
        domain: { const: health }
        rule_id: { const: health.weekly-review }
        dedupe_key: { type: string }
        title: { type: string }
        summary: { type: string }
        reason: { type: string }
        evidence_refs: { type: array, items: { type: string } }
        importance: { enum: [low, normal, high, urgent] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        allowed_actions:
          type: array
          items: { enum: [ignore, snooze, mute, create_draft, view_evidence] }
        created_at: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        data_freshness:
          type: object
          additionalProperties: false
          required: [observed_at, missing_ratio, coverage_days, sources, quality_score, latest_effective_date]
          properties:
            observed_at: { type: string, format: date-time }
            missing_ratio: { type: number, minimum: 0, maximum: 1 }
            coverage_days:
              type: object
              additionalProperties: { type: integer, minimum: 0, maximum: 7 }
            sources: { type: array, items: { type: string } }
            quality_score: { type: number, minimum: 0, maximum: 1 }
            latest_effective_date:
              oneOf:
                - { type: string, format: date }
                - { type: "null" }
    NexusReviewCreate:
      type: object
      additionalProperties: false
      required: [intent, summary, fields]
      properties:
        intent: { type: string }
        summary: { type: string, maxLength: 500 }
        fields: { type: object, additionalProperties: true }
        source_text: { type: string, maxLength: 4000 }
        source_refs:
          type: array
          maxItems: 16
          items: { type: string }
    NexusReview:
      type: object
      additionalProperties: false
      required: [protocol, review_id, reference, revision, domain, intent, summary, fields, risk_level, state, created_at, source_refs, trace_id, receipt, replayed]
      properties:
        protocol: { const: shadow.review.v1 }
        review_id: { type: string }
        reference: { type: string }
        revision: { type: integer }
        payload_hash: { type: string }
        expires_at: { type: [string, "null"], format: date-time }
        domain: { const: health }
        intent: { type: string }
        summary: { type: string }
        fields: { type: object, additionalProperties: true }
        risk_level: { const: L2 }
        state: { enum: [pending, committed, rejected] }
        created_at: { type: string, format: date-time }
        source_refs: { type: array, items: { type: string } }
        trace_id: { type: string }
        receipt:
          anyOf:
            - { type: string }
            - { type: "null" }
        replayed: { type: boolean }
    NexusReviewList:
      type: object
      additionalProperties: true
      required: [protocol, items, truncated, trace_id]
      properties:
        protocol: { const: shadow.review.v1 }
        items:
          type: array
          items: { $ref: "#/components/schemas/NexusReview" }
        truncated: { type: boolean }
        trace_id: { type: string }
    NullableNumber:
      anyOf:
        - { type: number }
        - { type: "null" }
    NullableInteger:
      anyOf:
        - { type: integer }
        - { type: "null" }
    HealthIndicators:
      type: object
      additionalProperties: false
      required:
        - diet_kcal
        - protein_g
        - steps
        - workout_sessions
        - workout_min
        - active_kcal
        - weight_kg
        - sleep_hours
        - mood_score
      properties:
        diet_kcal: { type: number }
        protein_g: { type: number }
        steps: { $ref: "#/components/schemas/NullableInteger" }
        workout_sessions: { type: integer }
        workout_min: { type: integer }
        active_kcal: { $ref: "#/components/schemas/NullableInteger" }
        weight_kg: { $ref: "#/components/schemas/NullableNumber" }
        sleep_hours: { $ref: "#/components/schemas/NullableNumber" }
        mood_score: { $ref: "#/components/schemas/NullableInteger" }
    HealthSummaryResult:
      type: object
      additionalProperties: false
      required: [summary, resource_uri, date, indicators, data_quality]
      properties:
        summary: { type: string, maxLength: 1200 }
        resource_uri: { type: string }
        date: { type: string, format: date }
        indicators:
          $ref: "#/components/schemas/HealthIndicators"
        data_quality:
          type: object
          description: 字段级覆盖、来源与新鲜度证据；缺失值不等同于零。
    HealthTrendStatistics:
      type: object
      additionalProperties: false
      required: [first, last, average, change, unit]
      properties:
        first: { $ref: "#/components/schemas/NullableNumber" }
        last: { $ref: "#/components/schemas/NullableNumber" }
        average: { $ref: "#/components/schemas/NullableNumber" }
        change: { $ref: "#/components/schemas/NullableNumber" }
        unit: { type: string }
    HealthTrendResult:
      type: object
      additionalProperties: false
      required: [summary, resource_uri, metric, days, data_points, statistics, data_quality]
      properties:
        summary: { type: string, maxLength: 1200 }
        resource_uri: { type: string }
        metric:
          enum: [weight_kg, sleep_hours, steps, heart_rate]
        days: { type: integer }
        data_points: { type: integer }
        statistics:
          $ref: "#/components/schemas/HealthTrendStatistics"
        data_quality:
          type: object
          description: 覆盖天数、来源、新鲜度与是否足以形成趋势判断。
    HealthDraftFields:
      type: object
      additionalProperties: false
      properties:
        food_id: { type: integer, minimum: 1 }
        weight_kg: { type: number, minimum: 20, maximum: 400 }
        sleep_hours: { type: number, minimum: 0, maximum: 24 }
        mood_score: { type: integer, minimum: 1, maximum: 10 }
        meal: { enum: [早餐, 午餐, 晚餐, 加餐] }
        name: { type: string, minLength: 1, maxLength: 120 }
        amount_g: { type: number, minimum: 0, maximum: 5000 }
        kcal: { type: number, minimum: 0, maximum: 20000 }
        protein_g: { type: number, minimum: 0, maximum: 1000 }
        fat_g: { type: number, minimum: 0, maximum: 1000 }
        carb_g: { type: number, minimum: 0, maximum: 5000 }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/HealthMealItem" }
        session_type: { type: string, minLength: 1, maxLength: 120 }
        duration_min: { type: integer, minimum: 1, maximum: 1440 }
        distance_km: { type: number, minimum: 0, maximum: 1000 }
        rpe: { type: integer, minimum: 1, maximum: 10 }
        notes: { type: string, maxLength: 500 }
    HealthMealItem:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        food_id: { type: integer, minimum: 1 }
        notes: { type: string, maxLength: 1000 }
        name: { type: string, minLength: 1, maxLength: 120 }
        amount_g: { type: number, minimum: 0, maximum: 5000 }
        kcal: { type: number, minimum: 0, maximum: 20000 }
        protein_g: { type: number, minimum: 0, maximum: 1000 }
        fat_g: { type: number, minimum: 0, maximum: 1000 }
        carb_g: { type: number, minimum: 0, maximum: 5000 }
    HealthRecordDraftInput:
      type: object
      additionalProperties: false
      required: [record_type, effective_date, fields]
      properties:
        operation: { enum: [update] }
        target_id: { type: integer, minimum: 1 }
        record_type:
          enum: [metric, meal, workout]
        effective_date:
          type: string
          format: date
        fields:
          $ref: "#/components/schemas/HealthDraftFields"
        note:
          type: string
          maxLength: 500
    HealthRecordDraftCreated:
      type: object
      additionalProperties: false
      required:
        - resource_uri
        - summary
        - draft_id
        - profile_id
        - status
        - direct_domain_write
        - replayed
      properties:
        resource_uri: { type: string }
        summary: { type: string }
        draft_id: { type: string }
        profile_id: { type: string }
        status: { const: pending }
        direct_domain_write: { const: false }
        replayed: { type: boolean }
    HealthRecordDraftCommitted:
      type: object
      additionalProperties: false
      required: [resource_uri, draft_id, profile_id, record_type, status, replayed]
      properties:
        resource_uri: { type: string }
        draft_id: { type: string }
        profile_id: { type: string }
        record_type: { enum: [metric, meal, workout] }
        status: { const: applied }
        replayed: { type: boolean }
    HealthRecordDraftSummary:
      type: object
      additionalProperties: false
      required: [resource_uri, draft_id, profile_id, record_type, effective_date, fields, note, created_at, status]
      properties:
        resource_uri: { type: string }
        draft_id: { type: string }
        profile_id: { type: string }
        record_type: { enum: [metric, meal, workout] }
        effective_date: { type: string, format: date }
        fields: { $ref: "#/components/schemas/HealthDraftFields" }
        note: { type: string }
        created_at: { type: string, format: date-time }
        status: { const: pending }
    HealthRecordDraftList:
      type: object
      additionalProperties: false
      required: [items, truncated]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/HealthRecordDraftSummary" }
        truncated: { type: boolean }
    HealthRecordDraftRejected:
      type: object
      additionalProperties: false
      required: [resource_uri, draft_id, profile_id, status, replayed]
      properties:
        resource_uri: { type: string }
        draft_id: { type: string }
        profile_id: { type: string }
        status: { const: rejected }
        replayed: { type: boolean }
