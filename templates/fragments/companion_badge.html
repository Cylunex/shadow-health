<section class="card flex flex-wrap items-center justify-between gap-3" hx-get="{{ u('/companion/badge') }}" hx-trigger="every 60s, drafts-changed from:body" hx-swap="outerHTML"><div><p class="text-sm font-semibold">{{ '有 ' ~ count ~ ' 份记录待核对' if count else '健康助手' }}</p><p class="text-xs text-slate-400">{{ notices[0] if notices else '记录有回执，变化有依据；没有新信息就不打扰。' }}</p></div><a class="btn-ghost" href="{{ u('/companion') }}">{{ '去核对' if count else '复盘与行动' }}</a></section>
